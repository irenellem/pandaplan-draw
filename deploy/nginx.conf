server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # nginx drops every server-level add_header in a location that sets its own, so the app shell
  # (also reached by `/` and the SPA fallback, both internal redirects here) repeats them.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Self-hosted draw.io webapp (pinned release, staged into the image). Served as its own
  # static tree: no SPA fallback, so a missing mount returns 404 and the app shows its placeholder.
  # 30 days, immutable: the files only change when ARG DRAWIO_VERSION in the Dockerfile changes, and
  # a revalidation round-trip per file on every open is what made a warm open slow. Their URLs carry
  # no version, so after a version bump a browser can keep the old release for up to 30 days. That
  # is a delay, not a breakage (old index.html is never cached, see below; old JS runs as a whole).
  # To roll a release out at once, serve it under a versioned path (see docs/CHANGES.md).
  location /drawio/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
  }


  # The drawio page itself must NEVER be cached. Correctness, not an oversight: a stored copy keeps
  # the response headers it was served with, so a stale Content-Security-Policy (frame-ancestors)
  # silently stops the editor from loading inside the app for that browser, with no way to recover
  # short of clearing the cache. It is 4 KB; the multi-MB files it pulls in are what get cached above.
  # The app's warm-up never prefetches it for the same reason.
  location = /drawio/index.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
